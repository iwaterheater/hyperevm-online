# nginx in front of the game server: HTTPS for the page, and the WebSocket passed through.
# Copy to /etc/nginx/sites-available/hyperevm-online, put your domain in place of game.example.com, link it into
# sites-enabled, and let certbot add the certificate:  sudo certbot --nginx -d game.example.com
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# no address may open connections or ask for pages faster than a player does
limit_conn_zone $binary_remote_addr zone=hyperevm_conn:10m;
limit_req_zone  $binary_remote_addr zone=hyperevm_req:10m rate=30r/s;

server {
    listen 80;
    server_name game.example.com;

    limit_conn hyperevm_conn 20;
    limit_req  zone=hyperevm_req burst=300 nodelay;

    # the map editor is for the machine the server runs on: it is not offered to the world
    location = /editor.html { return 404; }
    location /api/editor    { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the one header the server reads the client's address from (TRUST_PROXY=1): set here, never passed on from outside
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;   # a quiet socket is pinged by the server every 20 seconds
    }
}
